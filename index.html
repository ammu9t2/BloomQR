    <script>
      // Theme Toggle Logic
      (function() {
        const btn = document.getElementById('theme-toggle-btn');
        if (btn) {
          let toggling = false;
          btn.addEventListener('click', () => {
            if (toggling) return;
            toggling = true;
            setTimeout(() => { toggling = false; }, 200);

            const isDark = document.documentElement.classList.toggle('dark-theme');
            if (document.body) document.body.classList.toggle('dark-theme', isDark);
            window.__isDarkTheme = isDark;
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isDark ? '#141312' : '#f6f1e7');
            try {
              localStorage.setItem('app-theme', isDark ? 'dark' : 'light');
            } catch(e) {}
            window.dispatchEvent(new Event('resize'));
          });
        }
      })();
      (function() {
        const volPopup = document.createElement('div');
        volPopup.id = 'volume-hover-bar';
        volPopup.innerHTML = `
          <div class="vol-popup-inner">
            <span class="vol-percent">55%</span>
            <div class="vol-slider-wrap">
              <input type="range" class="vol-slider" min="0" max="100" value="55" />
            </div>
            <svg class="vol-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </div>
        `;
        document.body.appendChild(volPopup);

        const slider = volPopup.querySelector('.vol-slider');
        const percentText = volPopup.querySelector('.vol-percent');

        let hideTimer = null;

        function updateSliderBg(val) {
          slider.style.background = `linear-gradient(to right, #9d6438 ${val}%, #e2dacd ${val}%)`;
        }

        function showPopup(btn) {
          clearTimeout(hideTimer);
          const rect = btn.getBoundingClientRect();
          volPopup.style.left = `${rect.left + rect.width / 2}px`;
          volPopup.style.top = `${rect.top - 8}px`;
          volPopup.classList.add('visible');

          if (window.__bgAudio) {
            const cur = Math.round((window.__bgAudio.volume ?? 0.55) * 100);
            slider.value = cur;
            percentText.textContent = `${cur}%`;
            updateSliderBg(cur);
          }
        }

        function scheduleHide() {
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => {
            volPopup.classList.remove('visible');
          }, 280);
        }

        volPopup.addEventListener('mouseenter', () => clearTimeout(hideTimer));
        volPopup.addEventListener('mouseleave', scheduleHide);

        slider.addEventListener('input', (e) => {
          const val = parseInt(e.target.value, 10);
          percentText.textContent = `${val}%`;
          updateSliderBg(val);
          if (window.__bgAudio) {
            window.__bgAudio.volume = val / 100;
            if (val > 0 && window.__bgAudio.paused) {
              window.__bgAudio.play().catch(() => {});
            }
          }
        });

        document.addEventListener('mouseover', (e) => {
          const btn = e.target.closest('button[aria-label="Mute"], button[aria-label="Unmute"], button[title="Mute"], button[title="Unmute"]');
          if (btn) {
            showPopup(btn);
          }
        });

        document.addEventListener('mouseout', (e) => {
          const btn = e.target.closest('button[aria-label="Mute"], button[aria-label="Unmute"], button[title="Mute"], button[title="Unmute"]');
          if (btn) {
            scheduleHide();
          }
        });

        window.addEventListener('resize', () => {
          const btn = document.querySelector('button[aria-label="Mute"], button[aria-label="Unmute"], button[title="Mute"], button[title="Unmute"]');
          if (btn && volPopup.classList.contains('visible')) {
            const rect = btn.getBoundingClientRect();
            volPopup.style.left = `${rect.left + rect.width / 2}px`;
            volPopup.style.top = `${rect.top - 8}px`;
          }
        });
      })();
    </script>
